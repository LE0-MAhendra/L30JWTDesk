[package]
name = "l30-jwt-desk"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
hmac = "0.12"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
