name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      msix_identity_name:
        description: Package identity name from Partner Center
        required: false
        type: string
      msix_publisher:
        description: Publisher ID from Partner Center (for example, CN=...)
        required: false
        type: string
      msix_publisher_display_name:
        description: Publisher display name from Partner Center
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            args: "--bundles msi,nsis"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libfuse2 patchelf rpm xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'build-v__VERSION__' }}
          releaseName: L30JWTDesk ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: Signed installers for supported desktop platforms.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MS_STORE_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ inputs.msix_publisher || vars.MS_STORE_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.msix_publisher_display_name || vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (!$env:MSIX_IDENTITY_NAME -or !$env:MSIX_PUBLISHER -or !$env:MSIX_PUBLISHER_DISPLAY_NAME) {
            throw 'Set the MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER, and MS_STORE_PUBLISHER_DISPLAY_NAME repository variables from Partner Center.'
          }

          $env:VITE_MICROSOFT_STORE = 'true'
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store app build failed with exit code $LASTEXITCODE." }

          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $storeVersion = "$version.0"
          $stage = Join-Path $env:RUNNER_TEMP 'l30jwtdesk-msix'
          $assets = Join-Path $stage 'Assets'
          New-Item -ItemType Directory -Force $assets | Out-Null

          Copy-Item src-tauri/target/release/l30-jwt-desk.exe $stage
          Copy-Item src-tauri/icons/StoreLogo.png $assets
          Copy-Item src-tauri/icons/Square44x44Logo.png $assets
          Copy-Item src-tauri/icons/Square150x150Logo.png $assets

          $manifest = Get-Content src-tauri/msix/AppxManifest.xml -Raw
          $manifest = $manifest.Replace('__IDENTITY_NAME__', [System.Security.SecurityElement]::Escape($env:MSIX_IDENTITY_NAME))
          $manifest = $manifest.Replace('__PUBLISHER__', [System.Security.SecurityElement]::Escape($env:MSIX_PUBLISHER))
          $manifest = $manifest.Replace('__PUBLISHER_DISPLAY_NAME__', [System.Security.SecurityElement]::Escape($env:MSIX_PUBLISHER_DISPLAY_NAME))
          $manifest = $manifest.Replace('__VERSION__', $storeVersion)
          Set-Content (Join-Path $stage 'AppxManifest.xml') $manifest -Encoding utf8

          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$makeAppx) { throw 'MakeAppx.exe was not found on the runner.' }

          $output = Join-Path $PWD 'msix-output'
          New-Item -ItemType Directory -Force $output | Out-Null
          $msix = Join-Path $output "L30JWTDesk_${version}_x64.msix"
          & $makeAppx.FullName pack /d $stage /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE." }

          $zip = Join-Path $output "L30JWTDesk_${version}_x64.zip"
          Compress-Archive -Path $msix -DestinationPath $zip
          Move-Item $zip (Join-Path $output "L30JWTDesk_${version}_x64.msixupload")
      - name: Upload Microsoft Store packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: l30-jwt-desk-microsoft-store
          path: msix-output/*
      - name: Attach Microsoft Store packages to release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = if ('${{ github.ref }}'.StartsWith('refs/tags/')) { '${{ github.ref_name }}' } else { "build-v$version" }
          gh release upload $tag msix-output/* --clobber
