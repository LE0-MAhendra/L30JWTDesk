<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="description" content="Local-first JWT inspection desktop workspace" />
    <title>L30JWTDesk</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #0c0e13; }
      .launch-screen { display: grid; min-height: 100%; place-content: center; justify-items: center; gap: 16px; color: #f2f4f8; font: 600 16px system-ui, sans-serif; }
      .launch-mark { width: 64px; height: 64px; color: #b4bbca; animation: launch-pulse 1.1s ease-in-out infinite; }
      .launch-loader { width: 28px; height: 3px; overflow: hidden; border-radius: 99px; background: #202531; }
      .launch-loader::after { content: ''; display: block; width: 45%; height: 100%; border-radius: inherit; background: #7c83ff; animation: launch-progress 1.1s ease-in-out infinite; }
      @keyframes launch-pulse { 50% { opacity: .64; transform: scale(.96); } }
      @keyframes launch-progress { from { transform: translateX(-100%); } to { transform: translateX(230%); } }
      @media (prefers-reduced-motion: reduce) { .launch-mark, .launch-loader::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="launch-screen" role="status" aria-label="Loading L30JWTDesk"><svg class="launch-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 2.2 24.2 8v12L14 25.8 3.8 20V8L14 2.2Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.2 9.4h11.6M8.2 14h7.5M8.2 18.6h11.6" stroke="#f2f4f8" stroke-width="2.2" stroke-linecap="round"/><circle cx="18.8" cy="14" r="2.2" fill="#7c83ff" stroke="#0c0e13"/></svg><strong>L30JWTDesk</strong><span class="launch-loader"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
